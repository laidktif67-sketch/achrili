<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f5c">
<title>إدارة الدفع | AchriLi</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172744;background:#f5f7fb;--navy:#071f5c;--line:#e2e8f0;--muted:#64748b}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px max(16px,calc((100% - 1050px)/2));display:flex;justify-content:space-between}.page{max-width:1050px;margin:auto;padding:22px 16px}h1,h2{color:var(--navy)}.card,.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;font-weight:650;margin:8px 0}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font:inherit;background:#fff}textarea{min-height:65px}button{border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e8eef9;color:var(--navy)}button:disabled{opacity:.5}.muted{color:var(--muted);font-size:13px;line-height:1.7}.row{border-top:1px solid var(--line);padding:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:#a11}.success{color:#166534}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.page{padding:14px 12px}}
</style>
<script type="module">
import { supabase } from '/src/shared/services/supabase/client.js';
import { canEnablePaymentMethod } from '/src/features/payments/model/payment.js';
const $=id=>document.getElementById(id);let user,methods=[],payments=[];
const money=(v,c)=>Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+c;
function note(msg,kind=''){const n=$('notice');n.textContent=msg;n.className='notice '+kind;n.hidden=false}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
async function init(){
 const {data,error}=await supabase.auth.getSession();if(error||!data.session){location.replace('auth.html?next=payment-admin.html');return}
 user=data.session.user;if(user.app_metadata?.role!=='admin'){note('هذه الصفحة مخصصة للمدير المخوّل فقط.','error');return}
 $('workspace').classList.remove('hidden');await Promise.all([loadMethods(),loadPayments()]);
}
async function loadMethods(){
 const {data,error}=await supabase.from('PaymentMethod').select('*').order('code');if(error)throw error;methods=data||[];
 for(const m of methods){
  const card=el('section','card');card.append(el('h3','',m.displayName));
  const form=document.createElement('form');form.dataset.id=m.id;
  const fields=m.code==='CCP_TRANSFER'?[['accountHolder','اسم صاحب الحساب',m.accountHolder||''],['accountIdentifier','رقم CCP / RIP',m.accountIdentifier||''],['instructions','تعليمات للزبون',m.instructions||'']]:[['walletAddress','عنوان محفظة BEP20',m.walletAddress||''],['instructions','تعليمات للزبون',m.instructions||'']];
  for(const [name,title,value] of fields){const label=el('label','',title);const input=document.createElement(name==='instructions'?'textarea':'input');input.name=name;input.value=value;input.maxLength=name==='instructions'?2000:160;label.append(input);form.append(label)}
  if(m.code==='USDT_BEP20'){const p=el('p','muted','الشبكة مثبتة على BEP20. لن يتم تفعيل الطريقة دون عنوان صالح يبدأ بـ 0x ويتكون من 40 خانة hex بعده.');form.append(p)}
  const enabledLabel=el('label');const enabled=document.createElement('input');enabled.type='checkbox';enabled.name='enabled';enabled.checked=Boolean(m.enabled);enabled.style.width='auto';enabledLabel.append(enabled,document.createTextNode(' تفعيل وسيلة الدفع'));form.append(enabledLabel);
  const btn=el('button','','حفظ الإعدادات');btn.type='submit';form.append(btn);
  form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;try{
   const fd=new FormData(form);const patch={enabled:fd.has('enabled'),updatedAt:new Date().toISOString()};
   for(const [name] of fields)patch[name]=String(fd.get(name)||'').trim()||null;
   if(patch.enabled&&!canEnablePaymentMethod({...m,...patch}))throw new Error('لا يمكن تفعيل وسيلة الدفع قبل إدخال البيانات المطلوبة بصورة صحيحة.');
   if(m.code==='USDT_BEP20')patch.network='BEP20';
   const {error}=await supabase.from('PaymentMethod').update(patch).eq('id',m.id);if(error)throw new Error(error.message);
   note('تم حفظ إعدادات '+m.displayName+'.','success');$('methods').replaceChildren();await loadMethods();
  }catch(err){note(err.message||'تعذّر حفظ إعدادات الدفع.','error')}finally{btn.disabled=false}
  });card.append(form);$('methods').append(card)
 }
}
async function loadPayments(){
 const {data,error}=await supabase.from('Payment').select('id,customerId,requestId,quoteId,paymentMethodId,amount,currency,status,proofPath,transactionReference,reviewNote,createdAt,PaymentMethod(code,displayName)').order('createdAt',{ascending:false}).limit(100);
 if(error)throw error;payments=data||[];$('payments').replaceChildren();
 if(!payments.length){$('payments').append(el('p','muted','لا توجد إثباتات دفع حتى الآن.'));return}
 for(const p of payments){
  const card=el('section','row');card.append(el('h3','', (p.PaymentMethod?.displayName||p.paymentMethodId)+' · '+money(p.amount,p.currency)));
  card.append(el('p','muted','الحالة: '+p.status+' · الطلب: '+p.requestId+' · العرض: '+p.quoteId+' · العميل: '+p.customerId));
  if(p.transactionReference)card.append(el('p','muted','مرجع العملية: '+p.transactionReference));
  const {data:signed,error:signedError}=await supabase.storage.from('payment-proofs').createSignedUrl(p.proofPath,300);
  if(!signedError&&signed?.signedUrl){const a=el('a','','فتح إثبات الدفع (رابط مؤقت)');a.href=signed.signedUrl;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}
  if(p.reviewNote)card.append(el('p','muted','ملاحظة المراجعة: '+p.reviewNote));
  const form=document.createElement('form');form.className='actions';const status=document.createElement('select');status.name='status';
  for(const value of ['PENDING','UNDER_REVIEW','CONFIRMED','REJECTED']){const op=document.createElement('option');op.value=value;op.textContent=value;op.selected=p.status===value;status.append(op)}
  status.disabled=['CONFIRMED','REJECTED'].includes(p.status);
  const noteInput=document.createElement('input');noteInput.name='reviewNote';noteInput.placeholder='ملاحظة مراجعة (اختياري)';noteInput.maxLength=2000;noteInput.value=p.reviewNote||'';
  const btn=el('button','','حفظ المراجعة');btn.type='submit';form.append(status,noteInput,btn);
  form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;try{const statusValue=status.value;const patch={status:statusValue,reviewNote:noteInput.value.trim()||null};if(statusValue==='CONFIRMED'||statusValue==='REJECTED'){patch.reviewedBy=user.id;patch.reviewedAt=new Date().toISOString()}else{patch.reviewedBy=null;patch.reviewedAt=null}
   const {error}=await supabase.from('Payment').update(patch).eq('id',p.id);if(error)throw new Error(error.message);note('تم تحديث مراجعة الدفع. تأكد يدويًا من التحويل أو من مستكشف الشبكة قبل التأكيد.','success');await loadPayments()
  }catch(err){note(err.message||'تعذّر تحديث الدفع.','error')}finally{btn.disabled=false}});card.append(form);$('payments').append(card)
 }
}
$('refresh').addEventListener('click',()=>Promise.all([loadMethods(),loadPayments()]).catch(e=>note(e.message||'تعذّر تحديث البيانات.','error')));
init().catch(e=>note(e.message||'تعذّر فتح لوحة الدفع.','error'));
</script>
</head>
<body><header class="top"><strong>AchriLi · إدارة الدفع</strong><a href="admin.html">العودة للإدارة</a></header>
<main class="page"><h1>وسائل الدفع والتحويلات</h1><p class="muted">التحقق يدوي. لا تؤكد التحويل بناءً على صورة وحدها؛ راجع الحساب أو المعاملة على الشبكة. إعدادات CCP والمحفظة تبدأ غير مفعّلة.</p><div id="notice" class="notice" hidden></div><div id="workspace" class="hidden"><section><h2>إعدادات وسائل الدفع</h2><div id="methods"></div></section><section class="card"><div class="actions"><h2 style="margin-inline-end:auto">إثباتات الدفع</h2><button id="refresh" class="secondary" type="button">تحديث</button></div><div id="payments"></div></section></div></main>
</body></html>
