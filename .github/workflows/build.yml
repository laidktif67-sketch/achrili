name: Build

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build all HTML pages
        run: npm run build

  postgres-migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: achrili_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d achrili_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create isolated schema fixture
        run: |
          container_id="$(docker ps -q --filter ancestor=postgres:17 | head -n 1)"
          test -n "$container_id"
          docker exec -i "$container_id" psql -U postgres -d achrili_test -v ON_ERROR_STOP=1 < tests/postgres/atomic-quote-fixture.sql
      - name: Apply atomic quote migration
        run: |
          container_id="$(docker ps -q --filter ancestor=postgres:17 | head -n 1)"
          test -n "$container_id"
          docker exec -i "$container_id" psql -U postgres -d achrili_test -v ON_ERROR_STOP=1 < supabase/migrations/20261103175000_atomic_quote_workflow.sql
      - name: Run PostgreSQL integration assertions
        run: |
          container_id="$(docker ps -q --filter ancestor=postgres:17 | head -n 1)"
          test -n "$container_id"
          docker exec -i "$container_id" psql -U postgres -d achrili_test -v ON_ERROR_STOP=1 < tests/postgres/atomic-quote-integration.sql
