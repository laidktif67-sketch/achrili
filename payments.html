<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f5c">
<title>الدفع وإثبات التحويل | AchriLi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#071f5c;--blue:#16458f;--orange:#f59a23;--ink:#172744;--muted:#7b879c;--line:#e6ebf3;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Alexandria,system-ui,sans-serif}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 850px)/2))}.brand{font-size:22px;font-weight:800;color:var(--navy);text-decoration:none;direction:ltr}.brand span{color:var(--orange)}a{color:var(--blue);text-decoration:none}.page{max-width:850px;margin:auto;padding:24px 16px}.card,.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.muted,.small{color:var(--muted);font-size:11px;line-height:1.9}.quote{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.method{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:12px;border-radius:10px;margin:8px 0}.method input{margin-top:4px}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font:inherit;background:#fff}button{border:0;border-radius:9px;background:var(--navy);color:white;padding:11px 15px;font:700 12px Alexandria,system-ui,sans-serif;cursor:pointer}button:disabled{opacity:.5}.hidden{display:none!important}.error{color:#a11}.success{color:#166534}.warn{background:#fff7e6;border-color:#f4d9a5}@media(max-width:540px){.page{padding:16px 12px}.card{padding:14px}}
</style>
<script type="module">
import { supabase } from '/src/shared/services/supabase/client.js';
import { isAllowedProofFile, paymentMethodLabel } from '/src/features/payments/model/payment.js';
const $=id=>document.getElementById(id);
const quoteId=new URLSearchParams(location.search).get('quote');
const money=(v,c)=>Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+c;
function note(message,kind=''){const n=$('notice');n.textContent=message;n.className='notice '+kind;n.hidden=false}
function make(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
let user,quote,methods=[];
async function init(){
 const {data,error}=await supabase.auth.getSession();
 if(error||!data.session){location.replace('auth.html?next='+encodeURIComponent('payments.html'+location.search));return}
 user=data.session.user;
 if(!quoteId){note('افتح الدفع من عرض السعر الذي تريد دفعه.','warn');return}
 const {data:q,error:qError}=await supabase.from('Quote').select('id,requestId,currency,total,status,expiresAt').eq('id',quoteId).maybeSingle();
 if(qError||!q){note('تعذّر العثور على عرض السعر أو لا تملك صلاحية الوصول إليه.','error');return}
 if(q.status!=='SENT'||(q.expiresAt&&Date.parse(q.expiresAt)<=Date.now())){note('الدفع متاح فقط لعرض سعر مُرسل وغير منتهي الصلاحية.','warn');return}
 quote=q;$('quoteSummary').hidden=false;$('quoteSummary').textContent='المبلغ المعتمد في عرض السعر: '+money(q.total,q.currency)+' · رقم العرض: '+q.id;
 const {data:m,error:mError}=await supabase.from('PaymentMethod').select('id,code,displayName,accountHolder,accountIdentifier,qrImagePath,network,walletAddress,instructions').eq('enabled',true);
 if(mError){note('تعذّر تحميل وسائل الدفع المتاحة.','error');return}
 methods=(m||[]).filter(method => method.code==='CCP_TRANSFER' ? q.currency==='DZD' : method.code==='USDT_BEP20' ? q.currency==='USD' : false);
 if(!methods.length){note('لا توجد وسيلة دفع مفعّلة ومتوافقة مع عملة هذا العرض. CCP متاح لعروض DZD فقط، وUSDT BEP20 لعروض USD فقط حتى لا نستخدم سعر تحويل غير مضبوط.','warn');return}
 for(const method of methods){
  const label=make('label','method');const radio=document.createElement('input');radio.type='radio';radio.name='paymentMethod';radio.value=method.id;radio.required=true;
  const body=make('span','');body.append(make('strong','',method.displayName||paymentMethodLabel(method.code)));
  if(method.code==='CCP_TRANSFER'){body.append(make('p','small','صاحب الحساب: '+(method.accountHolder||'غير محدد')));body.append(make('p','small','بيانات التحويل: '+(method.accountIdentifier||'غير محددة')))}
  if(method.code==='USDT_BEP20'){body.append(make('p','small','الشبكة: BEP20 فقط'));body.append(make('p','small','العنوان: '+(method.walletAddress||'غير محدد')));body.append(make('p','small','تحذير: لا ترسل USDT عبر TRC20 أو ERC20 إلى عنوان BEP20.'))}
  if(method.instructions)body.append(make('p','small',method.instructions));
  label.append(radio,body);$('methods').append(label)
 }
 $('form').hidden=false;
}
$('form').addEventListener('submit',async e=>{
 e.preventDefault();note('جارٍ إرسال إثبات الدفع...');$('submit').disabled=true;
 let proofPath=null;
 try{
  if(!quote||!methods.length)throw new Error('لا توجد وسيلة دفع متاحة لهذا العرض.');
  const methodId=new FormData($('form')).get('paymentMethod');const method=methods.find(m=>m.id===methodId);
  if(!method)throw new Error('اختر وسيلة دفع صحيحة.');
  const file=$('proof').files[0];if(!isAllowedProofFile(file))throw new Error('ارفع صورة PNG/JPG/WebP أو PDF بحجم لا يتجاوز 5 ميغابايت.');
  const reference=$('reference').value.trim();if(reference.length>200)throw new Error('رقم العملية طويل جدًا.');
  const ext=file.type==='application/pdf'?'pdf':file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
  proofPath=user.id+'/'+crypto.randomUUID()+'.'+ext;
  const {error:uploadError}=await supabase.storage.from('payment-proofs').upload(proofPath,file,{contentType:file.type,upsert:false});
  if(uploadError)throw new Error('تعذّر رفع إثبات الدفع. '+uploadError.message);
  const {error:insertError}=await supabase.from('Payment').insert({quoteId:quote.id,requestId:quote.requestId,paymentMethodId:method.id,proofPath,transactionReference:reference||null});
  if(insertError)throw new Error('تعذّر تسجيل الدفع. تحقق من أن العرض ما زال صالحًا ثم أعد المحاولة.');
  $('form').reset();note('تم استلام إثبات الدفع بنجاح. الحالة الآن قيد المراجعة، ولم يتم تأكيد الدفع تلقائيًا.','success');
 }catch(error){note(error.message||'تعذّر إرسال إثبات الدفع.','error')}finally{$('submit').disabled=false}
});
init().catch(()=>note('حدث خطأ أثناء تحميل صفحة الدفع.','error'));
</script>
</head>
<body><header class="top"><a class="brand" href="index.html">Achri<span>Li</span></a><a href="quotes.html">طلباتي</a></header>
<main class="page"><h1>الدفع وإثبات التحويل</h1><p class="muted">أرسل الإثبات بعد تنفيذ التحويل. رفع الإثبات لا يعني تأكيد استلام الأموال؛ يراجع المدير العملية يدويًا.</p>
<div id="notice" class="notice" hidden></div><div id="quoteSummary" class="card" hidden></div>
<section class="card"><form id="form" hidden>
<h2>اختر وسيلة الدفع</h2><div id="methods"></div>
<label for="proof">إثبات الدفع (صورة أو PDF) *</label><input id="proof" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required>
<label for="reference">رقم العملية / ملاحظة مرجعية (اختياري)</label><input id="reference" maxlength="200" autocomplete="off">
<p class="small">لا ترسل كلمات مرور أو مفاتيح خاصة. لا ترسل عبر شبكة مختلفة عن الشبكة المحددة للوسيلة.</p>
<button id="submit" type="submit">إرسال إثبات الدفع للمراجعة</button>
</form></section></main>
</body></html>
